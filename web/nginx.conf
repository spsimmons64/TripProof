# Serves the SPA and proxies /api to the FastAPI container, so the browser sees one origin.
# TLS terminates in front of this (your existing reverse proxy / load balancer).
server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;

    client_max_body_size 50m;           # trip exports and credential scans

    # Security headers live in security-headers.inc and are included in every location: nginx drops
    # server-level add_header lines inside any location that sets its own header.
    include /etc/nginx/security-headers.inc;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;         # large packets and full re-checks
        add_header Cache-Control "no-store" always;   # API responses can carry PHI
        include /etc/nginx/security-headers.inc;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.inc;
    }

    # index.html names the current hashed CSS/JS bundles, so browsers must re-check it on every load;
    # otherwise a cached copy keeps pointing at the previous build after a deploy.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.inc;
    }
}
